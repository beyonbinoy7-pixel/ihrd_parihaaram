server:
  port: 8080

spring:
  application:
    name: parihaaram
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

app:
  jwt:
    # 256-bit+ secure key for HMAC-SHA256
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 Hours
  storage:
    upload-dir: ${FILE_STORAGE_PATH:uploads/evidence}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
